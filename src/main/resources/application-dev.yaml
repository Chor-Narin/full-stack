server:
  port: 9999

spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/mydb
    username: myuser
    password: mypassword
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update           # or 'validate' / 'none' in production
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        # Optional: better formatting in logs
        format_sql: true